name: Kobo to Airtable Sync

on:
  # Remove push/schedule if you want to prevent any automatic runs
  # Keep only workflow_dispatch so it can be invoked by 'gh workflow run'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r kobo-airtable-sync/requirements.txt

      - name: Run Kobo to Airtable Sync
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          BASE_ID: ${{ secrets.BASE_ID }}
          TABLE_ID: ${{ secrets.TABLE_ID }}
          FORM_UID: ${{ secrets.FORM_UID }}
          KOBO_FORM_UID_RDS: ${{ secrets.KOBO_FORM_UID_RDS }}
          RDS_CLIMB_TEST_BASE_ID: ${{ secrets.RDS_CLIMB_TEST_BASE_ID }}
          RDS_CLIMB_TEST_TABLE_ID: ${{ secrets.RDS_CLIMB_TEST_TABLE_ID }}
        run: python kobo-airtable-sync/src/kobo_to_airtable.py
