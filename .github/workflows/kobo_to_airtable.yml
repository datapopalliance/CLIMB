name: Kobo to Airtable Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"  # Runs every hour

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r kobo-airtable-sync/requirements.txt

      - name: Run Kobo to Airtable sync
        run: |
          python kobo-airtable-sync/src/kobo_to_airtable.py  # 🔥 Ensure correct path
