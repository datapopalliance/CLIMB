name: Kobo to Airtable Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:  # ✅ Allows manual triggering

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r kobo-airtable-sync/requirements.txt

      - name: Run Kobo to Airtable Sync
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          BASE_ID: ${{ secrets.BASE_ID }}
          TABLE_ID: ${{ secrets.TABLE_ID }}
        run: python kobo-airtable-sync/src/kobo_to_airtable.py
