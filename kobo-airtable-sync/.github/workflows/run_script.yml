name: Sync KoboToolbox to Airtable

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Kobo-to-Airtable Sync
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          FORM_UID: ${{ secrets.FORM_UID }}
          BASE_ID: ${{ secrets.BASE_ID }}
          TABLE_ID: ${{ secrets.TABLE_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python scripts/kobo_to_airtable.py
